<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>To-Do App</title>
  </head>
  <body>
    <main>
      <div class="createTodo">
        <div class="content">
          <h1 class="todoname">Create To-do</h1>
          <form action="">
            <input class="titleinp" type="text" placeholder="Enter Title" />
            <textarea
              class="textareainp"
              name=""
              id=""
              placeholder="Description About Task"
            ></textarea>
            <button class="createbtn">Create To-DO</button>
          </form>
        </div>
      </div>
      <div class="viewTodo">
        <div class="alltasks"></div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
